{% extends 'base.html' %}

{% block title %}Nova categoria{% endblock title %}

{% block content %}
<h1>Nova categoria</h1>
<form action="{% url 'posts:category_create' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input class="botao" type="submit" value="Criar categoria">
</form>
<a href="{% url 'posts:categories' %}">Voltar para as categorias</a>
{% endblock content %}
