{% extends 'base.html' %}

{% block title %}Nova notícia{% endblock title %}

{% block content %}
<h1>Nova notícia</h1>
<form action="{% url 'posts:create' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input class="botao" type="submit" value="Publicar">
</form>
<a href="{% url 'posts:index' %}">Voltar para as notícias</a>
{% endblock content %}
