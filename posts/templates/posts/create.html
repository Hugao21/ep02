{% extends 'base.html' %}

{% block title %}Novo post{% endblock title %}

{% block content %}
<h1>Novo post</h1>
<form action="{% url 'posts:create' %}" method="post">
    {% csrf_token %}
    <p>
        <label for="title">Título</label>
        <input type="text" name="title" id="title">
    </p>
    <p>
        <label for="content">Conteúdo (HTML)</label>
        <textarea name="content" id="content"></textarea>
    </p>
    <input class="botao" type="submit" value="Criar post">
</form>
<a href="{% url 'posts:index' %}">Voltar para a lista</a>
{% endblock content %}
